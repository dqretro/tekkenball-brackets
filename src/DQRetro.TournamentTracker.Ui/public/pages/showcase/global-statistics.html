<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Statistics | DQRetro</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../shared/layout/header/nav/nav.css">
</head>
<body class="dark">

<div id="nav-placeholder"></div>

<div class="container">
  <h1>Global Statistics</h1>

  <section class="overview-column">
    <h2>Most Used Characters</h2>

    <div class="filter-container" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
      <select id="gameFilter"></select>
      <select id="yearFilter"></select>
      <select id="characterFilter"></select>
      <select id="regionFilter"></select>
      <button id="reset-filters" class="button">Reset</button>
    </div>

    <div class="standings-table">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Character</th>
            <th>Count</th>
            <th>Usage %</th>
          </tr>
        </thead>
        <tbody id="char-usage-body"></tbody>
      </table>
    </div>
  </section>

  <section class="overview-column" style="margin-top:32px;">
    <h2>Character Usage Chart</h2>
    <canvas id="characterUsageChart" style="max-height:500px; width:100%;"></canvas>
  </section>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../../script.js"></script>
<!-- game-config.js must load before global.js -->
<script src="../tournaments/game-config.js"></script>
<script src="global.js"></script>
<script>
  loadNav();
  loadFooter();
</script>
</body>
</html>
