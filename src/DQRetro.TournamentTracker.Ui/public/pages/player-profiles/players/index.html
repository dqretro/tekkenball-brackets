<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../shared/layout/header/nav/nav.css">

  <style>
    .asset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      align-items: center;
    }

    .asset-row img {
      height: 100px;
      width: auto;
      object-fit: contain;
      border-radius: 8px;
      background-color: #1e1e1e;
      padding: 5px;
    }

    .color-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      border-radius: 8px;
      border: 2px solid #333;
      color: #fff;
      font-family: monospace;
      font-size: 0.8rem;
      text-align: center;
    }

    h3 {
      margin-top: 30px;
    }
  </style>
</head>
<body class="dark">

<div id="nav-placeholder"></div>

<div class="container">
  <h1>DQRetro Assets:</h1>

  <h3>Logos:</h3>
  <div id="logos" class="asset-row"></div>

  <h3>Banners:</h3>
  <div id="banners" class="asset-row"></div>

  <h3>Icons:</h3>
  <div id="icons" class="asset-row"></div>

  <h3>Color Codes:</h3>
  <div id="color-codes" class="asset-row"></div>

  <h1>Game Assets:</h1>

  <h3>Character Icons:</h3>
  <div id="character-icons" class="asset-row"></div>

  <h3>Game Posters:</h3>
  <div id="game-posters" class="asset-row"></div>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>

<script src="../../script.js"></script>
<script>
  // Load shared nav and footer
  loadNav();
  loadFooter();

  // Load assets from JSON
  fetch("assets.json")
    .then(response => response.json())
    .then(data => {
      displayAssets("logos", data.logos);
      displayAssets("banners", data.banners);
      displayAssets("icons", data.icons);
      displayColors("color-codes", data.colors);
    })
    .catch(err => console.error("Error loading assets.json:", err));

  function displayAssets(containerId, assets) {
    const container = document.getElementById(containerId);
    if (!assets || !container) return;
    assets.forEach(src => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = containerId;
      container.appendChild(img);
    });
  }

  function displayColors(containerId, colors) {
    const container = document.getElementById(containerId);
    if (!colors || !container) return;
    colors.forEach(color => {
      const box = document.createElement("div");
      box.classList.add("color-box");
      box.style.backgroundColor = color.hex;
      box.innerHTML = `<strong>${color.name}</strong><br>${color.hex}`;
      container.appendChild(box);
    });
  }
</script>

</body>
</html>
