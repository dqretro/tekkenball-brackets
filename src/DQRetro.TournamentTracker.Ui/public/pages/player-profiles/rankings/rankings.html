<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Rankings | DQRetro</title>
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../shared/layout/header/nav/nav.css">
</head>
<body class="dark">

<div id="nav-placeholder"></div>

<div class="container">
  <h1>Global Player Rankings</h1>
  <p id="rankingsSummary" style="color:var(--muted, #aaa); margin-top:-0.5rem;">Loading rankings…</p>

  <div class="table-scroll-container">
    <table id="rankingsTable" class="tournament-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Team</th>
          <th>Country</th>
          <th>Events</th>
          <th>Titles</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <p style="color:var(--muted, #aaa); font-size:0.85rem;">
    Points per event: 1st 10, 2nd 8, 3rd 6, 4th 5, 5th–6th 4, 7th–8th 2, any other placing 1.
  </p>
</div>

<div id="footer-placeholder"></div>

<script src="../../../script.js"></script>
<script src="rankings.js"></script>
</body>
</html>
