<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Brackets | DQRetro</title>

<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../../shared/layout/header/nav/nav.css" />
<link rel="stylesheet" href="standings.css" />

<style>
  .bracket-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    margin-top: 20px;
  }
  @media (max-width: 900px) {
    .bracket-layout {
      grid-template-columns: 1fr;
    }
  }

  .overview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line, #333);
    padding-bottom: 16px;
  }
  .overview-title h1 {
    margin: 0;
    font-size: 26px;
  }
  .overview-title h2 {
    margin: 4px 0 0 0;
    font-weight: normal;
    color: var(--muted, #888);
    font-size: 16px;
  }

  .sidebar-panel {
    background: var(--card-bg, #1e1e1e);
    border: 1px solid var(--line, #333);
    border-radius: 12px;
    padding: 16px;
    height: fit-content;
  }
  .sidebar-panel h3 {
    margin-top: 0;
    font-size: 16px;
    border-bottom: 1px solid var(--line, #333);
    padding-bottom: 8px;
    color: var(--text, #fff);
  }

  .bracket-nav-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .bracket-nav-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel, #2a2a2a);
    padding: 10px 14px;
    border-radius: 6px;
    color: var(--text, #fff);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .bracket-nav-item:hover {
    background: var(--highlight, #3a3a3a);
    border-color: var(--accent, #e50914);
  }
  .bracket-nav-item.active {
    background: var(--accent, #e50914);
    color: #fff;
    border-color: transparent;
  }
  .bracket-nav-item .badge {
    font-size: 11px;
    background: rgba(0,0,0,0.3);
    padding: 2px 6px;
    border-radius: 4px;
    opacity: 0.8;
  }

  .viewer-panel {
    background: var(--card-bg, #1e1e1e);
    border: 1px solid var(--line, #333);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .viewer-header h3 {
    margin: 0;
    font-size: 18px;
  }

  .iframe-container {
    position: relative;
    width: 100%;
    min-height: 650px;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line, #333);
  }
  .iframe-container iframe {
    width: 100%;
    height: 100%;
    min-height: 650px;
    border: none;
  }

  .event-summary-bar {
    display: flex;
    gap: 20px;
    font-size: 14px;
    color: var(--muted, #888);
    margin-top: 6px;
  }
  .event-summary-bar span strong {
    color: var(--text, #fff);
  }

  .not-found {
    padding: 40px;
    text-align: center;
    color: var(--muted, #888);
  }
</style>
</head>

<body class="dark">
  <div id="nav-t-placeholder"></div>
  <script src="../../shared/layout/header/nav/nav_t.js" defer></script>

  <div class="container">
    <div class="overview-header">
      <div class="overview-title">
        <h1 id="event-main-title">Event Brackets</h1>
        <h2 id="standings-title">Loading event details...</h2>
        <div class="event-summary-bar">
          <span>Entrants: <strong id="entrant-count">0</strong></span>
          <span>Stages: <strong id="pool-count">0</strong></span>
          <span>Format: <strong>Double Elimination</strong></span>
        </div>
      </div>
      <div id="back-to-events" class="back-button"></div>
    </div>

    <div id="content-container">
      <div class="bracket-layout">
        <!-- Sidebar Navigation for Pools & Top Cut -->
        <aside class="sidebar-panel">
          <h3>Select Bracket</h3>
          <div id="poolsContainer" class="bracket-nav-list">
            <!-- Dynamically populated -->
          </div>
        </aside>

        <!-- Main Bracket Viewer -->
        <main class="viewer-panel">
          <div class="viewer-header">
            <h3 id="current-bracket-title">Bracket View</h3>
          </div>
          <div class="iframe-container">
            <iframe id="bracket-iframe"></iframe>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../../shared/utils/not-found.js"></script>
  <script src="../../script.js"></script>
  <script src="brackets.js" defer></script>

  <script>
    loadNav();
    loadFooter();
  </script>
</body>
</html>
