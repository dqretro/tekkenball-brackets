<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bracket</title>
<link rel="stylesheet" href="styles.css" />
<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700" rel="stylesheet">
</head>
<body>
<div class="theme theme-dark-trendy">
  <!-- Bracket wrapper -->
  <div class="bracket-wrapper">
    <div class="bracket" id="bracket-container"></div>
  </div>

  <!-- Dropdown theme selector -->
  <div class="theme-switcher">
    <h2>Select a theme</h2>
    <select id="theme-selector">
      <option value="theme-dark-trendy" selected>Trendy</option>
      <option value="theme-light">Light</option>
      <option value="theme-dark">Dark</option>
      <option value="theme-halloween">Halloween</option>
      <option value="theme-christmas">Christmas</option>
      <option value="theme-valentines">Valentines</option>
      <option value="theme-grass">Grass</option>
      <option value="theme-blue">Blue</option>
      <option value="theme-water">Water</option>
      <option value="theme-blackout">Blackout</option>
      <option value="theme-purpley">Purpley</option>
    </select>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
