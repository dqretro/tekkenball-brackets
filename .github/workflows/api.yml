name: Build & Publish API

on:
  push:
    branches:
     - main
    paths:
     - "src/DQRetro.TournamentTracker.Api/**"
     - "src/DQRetro.TournamentTracker.Db/**"
     - ".github/workflows/api.yml"
  pull_request:
    paths:
     - "src/DQRetro.TournamentTracker.Api/**"
     - ".github/workflows/api.yml"

jobs:
  build:
    name: Build & Publish API
    runs-on: "ubuntu-latest"
    
    env:
      API_CSPROJ_PATH: src/DQRetro.TournamentTracker.Api/DQRetro.TournamentTracker.Api.csproj
      API_OUTPUT_FOLDER: ./DQRetro.TournamentTracker.Api
      DOTNET_CONFIGURATION: Release
      DOTNET_SERVER_GC: false
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    
    steps:
      - name: "Src: Checkout"
        uses: actions/checkout@v5
      
      - name: ".NET: Install SDK"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      
      - name: ".NET: Restore"
        run: dotnet restore ${{ env.API_CSPROJ_PATH }}
      
      - name: ".NET: Build"
        run: dotnet build ${{ env.API_CSPROJ_PATH }} --configuration ${{ env.DOTNET_CONFIGURATION }} --no-restore /p:ServerGarbageCollection=${{ env.DOTNET_SERVER_GC }}
      
      - name: ".NET: Publish"
        run: dotnet publish ${{ env.API_CSPROJ_PATH }} --configuration ${{ env.DOTNET_CONFIGURATION }} --no-restore --no-build --output ${{ env.API_OUTPUT_FOLDER }} /p:ServerGarbageCollection=${{ env.DOTNET_SERVER_GC }}

      # I'm using built-in .NET functionality to list basic dependency version info (list outdated, deprecated or vulnerable packages).
      # Whilst using dependabot or snyk may be beneficial here, I'm trying to avoid using third party libraries or services here, and dependabot is overkill
      # since I want to be in control of the dependencies, not having them auto-upgrade. There are valid reasons to remain on outdated versions, such as bugs.
      # These 3 "dotnet list package" commands will not fail the build if values are returned. They are purely informational.
      - name: ".NET: List Outdated Dependencies"
        run: dotnet list ${{ env.API_CSPROJ_PATH }} package --outdated

      - name: ".NET: List Deprecated Dependencies"
        run: dotnet list ${{ env.API_CSPROJ_PATH }} package --deprecated

      - name: ".NET: List Vulnerable Dependencies"
        run: dotnet list ${{ env.API_CSPROJ_PATH }} package --vulnerable --include-transitive

      - name: "Publish: API Artifact"
        if: ${{ env.IS_MAIN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: DQRetro.TournamentTracker.Api
          path: ${{ env.API_OUTPUT_FOLDER }}
          compression-level: 9 # Refers to ZLib compression levels (between 0(none) and 9(heavily compressed))
          if-no-files-found: error
