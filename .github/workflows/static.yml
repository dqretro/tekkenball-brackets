# Deploys the static site (src/DQRetro.TournamentTracker.Ui/public) to GitHub Pages.
# Live URL: https://dqretro.github.io/tekkenball-brackets/
#
# Secrets used (Settings -> Secrets and variables -> Actions):
#   YOUTUBE_API_KEY  optional. Browser key for the gallery page. Restrict it in
#                    Google Cloud to HTTP referrers https://dqretro.github.io/*
#                    (+ http://localhost:3000/* for local dev) and to the
#                    "YouTube Data API v3" only. If unset, the gallery falls back
#                    to pages/gallery/gallery-videos.json.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Called by refresh-data.yml after it commits new data. Commits made with
  # GITHUB_TOKEN don't trigger "push" workflows, so the refresh deploys explicitly.
  workflow_call:
    inputs:
      ref:
        description: "Commit to deploy (defaults to the triggering commit)"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_DIR: ./src/DQRetro.TournamentTracker.Ui/public

# Two jobs, as in GitHub's Pages template: "build" uploads the artifact, "deploy"
# publishes it. If only the deploy step fails (e.g. a transient "No artifacts named
# github-pages" error), use "Re-run failed jobs": it redeploys the existing artifact.
# "Re-run all jobs" uploads a second artifact into the same run, which deploy-pages
# rejects; start a new run with "Run workflow" instead.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false   # job never pushes; generated files can't be committed

      - name: Validate data
        run: node .github/scripts/validate-data.js

      # Writes config.json into the Pages artifact only (inside the runner).
      # It is gitignored and the job has read-only repo access, so it is never committed.
      # The key is passed via env (not interpolated into the script) to avoid injection/log leaks.
      - name: Generate gallery config.json from secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cfg="$SITE_DIR/pages/gallery"
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY not set - gallery will use gallery-videos.json fallback."
            rm -f "$cfg/config.json"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const cfg = JSON.parse(fs.readFileSync(dir + "/config.example.json", "utf8"));
            cfg.YOUTUBE_API_KEY = process.env.YOUTUBE_API_KEY;
            fs.writeFileSync(dir + "/config.json", JSON.stringify(cfg, null, 2));
          ' "$cfg"
          echo "Generated $cfg/config.json"

      # Homepage Twitch overlay: the public URL of the live-status Worker
      # (deploy-twitch-worker.yml). It is a repository VARIABLE, not a secret.
      # Without it, live-config.json is not written and the overlay stays off.
      - name: Generate Twitch live-config.json
        env:
          TWITCH_LIVE_STATUS_URL: ${{ vars.TWITCH_LIVE_STATUS_URL }}
        run: |
          dir="$SITE_DIR/shared/live"
          rm -f "$dir/live-config.json"
          if [ -z "$TWITCH_LIVE_STATUS_URL" ]; then
            echo "TWITCH_LIVE_STATUS_URL not set - homepage live overlay disabled."
            exit 0
          fi
          node -e '
            const url = process.env.TWITCH_LIVE_STATUS_URL.trim();
            if (!/^https:\/\/[^\s"<>]+$/.test(url)) { console.error("TWITCH_LIVE_STATUS_URL must be an https:// URL"); process.exit(1); }
            require("fs").writeFileSync(process.argv[1] + "/live-config.json", JSON.stringify({ statusUrl: url }, null, 2));
          ' "$dir"
          echo "Generated $dir/live-config.json"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Dotfiles are not included in the artifact (upload-pages-artifact v4+);
      # the site doesn't use any.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
